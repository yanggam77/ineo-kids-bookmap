<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사계절 어린이 교양 지도</title>
<meta name="description" content="사계절출판사 어린이 교양서를 시리즈별로 한눈에 보는 페이지 · 인어(@ineo_kids)">
<meta property="og:title" content="사계절 어린이 교양 지도">
<meta property="og:description" content="AI시대에 인문학을 읽는 어린이, 인어가 고른 사계절 교양서">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 장짜리 지도. 메인(대표 5종 → 새 책 → 시리즈 타일) ↔ 시리즈 화면(표지 그리드), 주소의 #으로 전환 */
:root{
  --paper:#F2F6F7;      /* 바닷물 빛이 살짝 도는 종이 */
  --card:#FFFFFF;
  --ink:#10283A;        /* 깊은 바다 남색 */
  --muted:#5A6F7C;
  --line:#D5E0E4;
  --sea:#1C7C7A;        /* 인어의 청록 */
  --mark:#FFD54A;       /* 형광펜 노랑 */
  --cover-bg:#E3EBEE;
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1C26;--card:#132733;--ink:#E6EEF1;--muted:#9AB0BC;--line:#24404F;--sea:#5CC3BE;--mark:#F2C94C;--cover-bg:#1A3240;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0D1C26;--card:#132733;--ink:#E6EEF1;--muted:#9AB0BC;--line:#24404F;--sea:#5CC3BE;--mark:#F2C94C;--cover-bg:#1A3240;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--sea);font-weight:600}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding-inline:2px}

/* 머리 */
.head{display:grid;gap:10px;padding-bottom:22px;border-bottom:1.5px solid var(--ink)}
.head h1{font-size:clamp(30px,7.4vw,48px);font-weight:800;letter-spacing:-.02em}
.head p{margin:0;color:var(--muted);max-width:34em}

section{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:700}
.sec-h small{color:var(--muted);font-size:13px}

/* 표지 공통 */
.cover{display:block;aspect-ratio:3/4;width:100%;max-width:100%;background:var(--cover-bg);border-radius:3px;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 8px 18px -12px rgba(16,40,58,.45)}
.cover img{width:100%;height:100%;object-fit:contain;display:block}
.cover .ph{display:grid;place-items:center;height:100%;padding:10px;text-align:center;font-family:var(--f-display);font-size:13px;color:var(--muted)}

/* 대표 5종 */
.feat{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
@media (min-width:720px){.feat{grid-auto-flow:row;grid-template-columns:repeat(5,1fr);overflow:visible}}
.feat a{scroll-snap-align:start;text-decoration:none;display:grid;gap:8px;align-content:start}
.feat .rank{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--sea)}
.feat .t{font-weight:600;font-size:14px;line-height:1.4}
.feat .s{font-size:12px;color:var(--muted)}

/* 새 책 */
.new{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.new{grid-template-columns:repeat(4,minmax(0,1fr))}}
.new a{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px}
.new .t{font-size:13px;font-weight:600;line-height:1.35}
.new .d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 시리즈 타일 */
.series{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:720px){.series{grid-template-columns:repeat(2,minmax(0,1fr))}.series .wide{grid-column:1/-1}}
.tile{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--sea);transform:translateY(-2px)}
.tile:focus-visible,.feat a:focus-visible,.grid a:focus-visible,.new a:focus-visible,.back:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
.fan{position:relative;height:120px}
.fan .cover{position:absolute;width:66px;bottom:0}
.fan .cover:nth-child(1){left:0;transform:rotate(-7deg)}
.fan .cover:nth-child(2){left:26px;transform:rotate(-1deg);z-index:1}
.fan .cover:nth-child(3){left:52px;transform:rotate(6deg);z-index:2}
.tile h3{font-size:18px;font-weight:700}
.tile p{margin:4px 0 8px;font-size:13px;color:var(--muted);line-height:1.5}
.tile .go{font-size:12.5px;font-weight:600;color:var(--sea)}

/* 시리즈 화면 */
.back{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.s-head{display:grid;gap:8px;margin-top:20px;padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
.s-head h1{font-size:clamp(28px,6.6vw,42px);font-weight:800;letter-spacing:-.02em}
.s-head p{margin:0;color:var(--muted);max-width:36em}
.sub-h{font-family:var(--f-display);font-size:17px;font-weight:700;margin:30px 0 12px;display:flex;gap:8px;align-items:baseline}
.sub-h small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;margin-top:20px}
@media (min-width:720px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 18px}}
.grid a{text-decoration:none;display:grid;gap:7px;align-content:start;position:relative}
.grid .t{font-size:12.5px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.grid .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:6px;left:-4px;z-index:1;background:var(--mark);color:#10283A;font:700 10.5px var(--f-body);letter-spacing:.06em;padding:2px 7px;border-radius:2px}

footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer a{color:var(--sea);font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>

const IMG  = id => "https://www.sakyejul.net/publishing/sakyejul/book/" + id + ".jpg";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cut = new Date(); cut.setMonth(cut.getMonth() - NEW_MONTHS);
const isNew = b => b.d && new Date(b.d) >= cut;
const byDate = (a,b) => (b.d||"").localeCompare(a.d||"");
const mainNames = new Set(MAIN_SERIES.map(s => s.name));
const inSeries = key => key === "etc"

  : BOOKS.filter(b => b.s === MAIN_SERIES.find(s => s.key === key).name);

const cover = b => `<span class="cover"><img src="${IMG(b.id)}" alt="${esc(b.t)} 표지" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:this.alt.replace(/ 표지$/,'')}))"></span>`;

function card(b){
  return `<a href="${LINK(b.id)}" ${ext}>${isNew(b)?'<span class="badge">NEW</span>':''}${cover(b)}

}
function tile(s, books, wide){
  const top = [...books].sort(byDate).slice(0,3);
  return `<a class="tile${wide?' wide':''}" href="#${s.key}">

}

function seriesPage(key){

  const books = inSeries(key);

    const groups = {};

    const names = Object.keys(groups).sort((a,b)=>rank(a)-rank(b));
    body = names.map(n => `<h2 class="sub-h">${esc(n)} <small>${groups[n].length}권</small></h2>
      <div class="grid" style="margin-top:0">${groups[n].sort(byDate).map(card).join("")}</div>`).join("");
  } else {
    body = `<div class="grid">${books.sort(byDate).map(card).join("")}</div>`;
  }
  return `<button class="back" type="button" id="back">← 교양 지도로</button>
  <header class="s-head"><span class="eyebrow">사계절 어린이 교양 시리즈 · ${books.length}권</span>
    <h1>${esc(s.name)}</h1><p>${esc(s.desc)}</p></header>${body}`;
}

const foot = `<footer><span>© 사계절출판사 · 어린이 교양서</span>
  <span><a href="https://www.instagram.com/ineo_kids/" ${ext}>인어 인스타그램</a> · <a href="https://www.sakyejul.net/" ${ext}>사계절 홈페이지</a></span></footer>`;

function render(){
  const key = location.hash.slice(1);
  const ok = key === "etc" || MAIN_SERIES.some(s => s.key === key);
  document.getElementById("app").innerHTML = (ok ? seriesPage(key) : home()) + foot;
  const back = document.getElementById("back");
  if (back) back.onclick = () => { location.hash = ""; };
  window.scrollTo(0,0);
  document.title = ok ? (key==="etc"?ETC.name:MAIN_SERIES.find(s=>s.key===key).name) + " · 사계절 어린이 교양 지도" : "사계절 어린이 교양 지도";
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
